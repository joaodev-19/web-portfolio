<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portfolio - João Silva</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <a href="#hero" class="home-link" aria-label="Back to introduction">
            <span aria-hidden="true">JS</span>
        </a>
    </header>
    <main>
        <section id="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    Hi, I'm João Pedro.
                </h1>

                <p class="hero-subtitle">
                    Full-Stack Software Developer
                </p>

                <p class="hero-description">
                    I build web applications, solve problems, and enjoy learning how software works.
                </p>
                
                <div class="hero-actions">
                    <a class="btn btn-primary" href="#projects">
                        See My Projects
                    </a>
                    <a class="btn btn-secondary" href="#contact">
                        Contact Me
                    </a>
                </div>    
            </div>

            <div class="container-img">
                <div class="box-img">

                    <img 
                        src="./pfp2.png" 
                        alt="Portrait of João Pedro" 
                        class="hero-img"
                    >
                </div>
            </div>
        </section>




        <section class="section" id="about">
            <h2 class="section-title">Who am I?</h2>
        </section>
        <section class="section"  id="projects">
            <h2 class="section-title">My Projects</h2>
        </section>
        <section class="section"  id="contact">
            <h2 class="section-title">Contact Me</h2>
        </section>
    </main>
    <footer>
        
    </footer>
</body>
</html>
